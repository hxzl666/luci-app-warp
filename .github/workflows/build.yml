name: Build Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build ipk
        run: |
          chmod +x scripts/build-ipk.sh
          scripts/build-ipk.sh

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/v}" \
            luci-app-warp*.ipk luci-app-warp*.apk \
            --title "${GITHUB_REF#refs/tags/v}" \
            --generate-notes
