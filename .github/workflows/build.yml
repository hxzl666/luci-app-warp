name: Build Packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-ipk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ipk
        run: |
          chmod +x scripts/build-ipk.sh
          scripts/build-ipk.sh

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-warp-ipk
          path: luci-app-warp*.ipk

  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build apk via Alpine container
        run: |
          chmod +x scripts/build-apk.sh
          docker run --rm \
            -v "$PWD:/repo" \
            -w /repo \
            alpine:3.20 \
            sh -c "apk add --no-cache apk-tools && sh scripts/build-apk.sh"

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-warp-apk
          path: luci-app-warp*.apk
          if-no-files-found: warn

  release:
    needs: [build-ipk, build-apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: luci-app-warp-ipk
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: luci-app-warp-apk
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/v}" \
            dist/*.ipk dist/*.apk \
            --title "${GITHUB_REF#refs/tags/v}" \
            --generate-notes
